[tools]
# Match go.mod's `go` directive. golangci-lint typechecks with the go on PATH,
# so the commit hook and `task lint` select this one: an ambient go newer than
# the one golangci-lint was built with fails every package's typecheck.
go = "1.26.6"
# Single source for the lint gate's version: ci.yml reads this pin back, so
# neither lane floats onto a release the other does not run.
golangci-lint = "2.13.2"

[env]
# TODO: drop once golangci-lint's cached issues carry checkout-relative
# positions — v2.12.2 keys the issue cache checkout-independently but stores
# absolute paths, so a sibling checkout replays them and resolves //nolint
# against the wrong tree. The prek commit hook inherits this.
GOLANGCI_LINT_CACHE = "{{config_root}}/.task/golangci-lint"
