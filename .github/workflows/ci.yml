name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack-ref-baseline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: ./.github/actions/wasm
      - uses: ./.github/actions/cli-test-env
      - name: Actual baseline stack ref reads
        run: go test -race -run '^TestStackListBatchRefReadsFollowRequestedTopology$' -v ./internal/cli 2>&1 | tee ref-topology-baseline.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-ref-baseline-${{ matrix.os }}
          path: ref-topology-baseline.txt
