name: Fetch connectivity diagnostic
on:
  workflow_dispatch:
    inputs:
      commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - id: git
        run: |
          version="$(sed -n 's/^version=//p' scripts/build-git.sh)"
          {
            echo "version=$version"
            echo "prefix=$RUNNER_TOOL_CACHE/ccx-git/$version/$RUNNER_ARCH"
            echo "toolchain=$({ echo "${ImageOS:-}"; cc --version | sed -n 1p; } | shasum -a 256 | cut -c1-16)"
          } >> "$GITHUB_OUTPUT"
      - id: git-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.git.outputs.prefix }}
          key: git-${{ steps.git.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.git.outputs.toolchain }}-${{ hashFiles('scripts/build-git.sh') }}
      - if: steps.git-cache.outputs.cache-hit != 'true'
        env:
          PREFIX: ${{ steps.git.outputs.prefix }}
        run: bash scripts/build-git.sh "$PREFIX"
      - env:
          PREFIX: ${{ steps.git.outputs.prefix }}
        run: echo "$PREFIX/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update -qq && sudo apt-get install -y strace
      - run: python3 scripts/fetch-connectivity-probe.py
        env:
          PROBE_OUTPUT: ${{ runner.temp }}/fetch-connectivity
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fetch-connectivity
          path: ${{ runner.temp }}/fetch-connectivity
