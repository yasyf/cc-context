name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crossing-baseline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: ./.github/actions/wasm
      - uses: ./.github/actions/cli-test-env
      - name: Actual baseline provider-crossing visits
        shell: bash
        run: |
          set -o pipefail
          go test -race -run '^TestCrossing' -v ./internal/gtmeta 2>&1 | tee crossing-baseline.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crossing-baseline-${{ matrix.os }}
          path: crossing-baseline.txt
