name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  retired-holder-demand:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: ./.github/actions/wasm
      - uses: ./.github/actions/cli-test-env
      - name: Actual retired holder precedence and error demand
        shell: bash
        run: |
          set -o pipefail
          go test -race -run '^TestRetiredDiscoveryCannotBeSkippedForRegisteredRefs$' -v ./internal/vcs 2>&1 | tee retired-holder-demand.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retired-holder-demand-${{ matrix.os }}
          path: retired-holder-demand.txt
