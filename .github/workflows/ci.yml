name: CI
on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        required: true
permissions:
  contents: read
jobs:
  retired-census-before:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install syscall observer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace
      - name: Real retired pointer cost and error controls
        env:
          CCX_RETIRED_CENSUS_STRACE: before
          CCX_RETIRED_CENSUS_STRACE_OUTPUT: ${{ runner.temp }}/retired-census-cost
        run: go test -count=1 -v -run '^Test(CoHoldersRetiredCensusCost|CoHoldersRetiredIncompleteGitdirCost|CoHoldersRetiredBacklinkErrorBoundary|ParseRetiredCensusCall)$' ./internal/vcs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retired-census-before
          path: ${{ runner.temp }}/retired-census-cost
