name: CCX mixed-root info baseline
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Immutable fixture commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/cli-test-env
      - uses: ./.github/actions/wasm
      - name: Run the unchanged mixed-root regression
        run: go test -race -timeout 5m ./internal/cli -run '^TestStackListBatchKeepsNativeAndLegacyTrunksSeparate$' -count=1 -v
