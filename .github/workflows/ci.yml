name: CI

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact diagnostic source to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup-activity-probe-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: ./.github/actions/wasm
      - uses: ./.github/actions/cli-test-env
      - name: Exact logical and resume guard call order and scopes
        shell: bash
        run: |
          set -o pipefail
          go test -race -run '^TestDisplacedActivityProbeCallCountsCI$' -v ./internal/cleanup/relocate 2>&1 | tee guard-counts.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cleanup-activity-probe-counts
          path: guard-counts.txt
