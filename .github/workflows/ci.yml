name: Persisted ancestor cache transition
on:
  pull_request:
    branches: [fix/semantic-ancestor-persisted-cache]
permissions:
  contents: read
concurrency:
  group: persisted-ancestor-cache-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  persisted-ancestor-cache:
    if: github.head_ref == 'proof/semantic-ancestor-persisted-cache'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/wasm
      - name: Reconcile same Schema3 variant and reuse retained vectors
        run: |
          set -euo pipefail
          go test -race -count=1 -v -run '^TestLoadPrunesAncestorIgnoredPersistedFiles$' ./internal/semsearch/index | tee "$RUNNER_TEMP/semantic-ancestor-cache-fixed.log"
      - uses: actions/checkout@v7
        with:
          ref: e39f97d38c01d78531eb8ef9c4ff71a8ae03df32
          path: .ci-semantic-ancestor-before
          persist-credentials: false
      - name: Released v0.89.16 stale-cache negative on the same fixture
        run: |
          set -euo pipefail
          test "$(git -C .ci-semantic-ancestor-before rev-parse HEAD)" = e39f97d38c01d78531eb8ef9c4ff71a8ae03df32
          cp internal/semsearch/index/ancestor_cache_test.go .ci-semantic-ancestor-before/internal/semsearch/index/
          cp internal/format/formatcore.wasm .ci-semantic-ancestor-before/internal/format/
          cp internal/semsearch/embed/embedcore.wasm .ci-semantic-ancestor-before/internal/semsearch/embed/
          cp -R internal/semsearch/chunk/grammars .ci-semantic-ancestor-before/internal/semsearch/chunk/
          cd .ci-semantic-ancestor-before
          status=0
          go test -race -count=1 -v -run '^TestLoadPrunesAncestorIgnoredPersistedFiles$' ./internal/semsearch/index > "$RUNNER_TEMP/semantic-ancestor-cache-before.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/semantic-ancestor-cache-before.log"
          test "$status" -eq 1
          grep -F 'SEMANTIC_ANCESTOR_STALE_CACHE files=2 reindexed=0 encoded=0' "$RUNNER_TEMP/semantic-ancestor-cache-before.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-ancestor-cache-transition
          path: ${{ runner.temp }}/semantic-ancestor-cache-*.log
