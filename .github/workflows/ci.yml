name: NEVER MERGE native promisor parsed-state diagnostic
on:
  workflow_dispatch:
    inputs:
      commit:
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/diag/promisor-native-parsed-state'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Build pinned stock Git with test-only helpers
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          bash scripts/build-git-parsed-state.sh "$RUNNER_TEMP/git-parsed-state"
          echo "$RUNNER_TEMP/git-parsed-state/bin" >> "$GITHUB_PATH"
      - name: Existing native context controls
        env:
          PROBE_OUTPUT: ${{ runner.temp }}/promisor-parsed-state/context
        run: python3 scripts/promisor-context-probe.py
      - name: Fresh and parsed native object controls
        env:
          PROBE_OUTPUT: ${{ runner.temp }}/promisor-parsed-state/native
        run: python3 scripts/promisor-parsed-state-probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: promisor-parsed-state
          path: |
            ${{ runner.temp }}/promisor-parsed-state
            parsed-state-build-source.json
