name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  displaced-admin-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: ./.github/actions/wasm
      - uses: ./.github/actions/cli-test-env
      - name: Same captured admin at a non-native directory
        shell: bash
        run: |
          set -o pipefail
          go test -race -run '^TestPausedRetirementFollowsCapturedDisplacedAdminCI$' -v ./internal/cleanup/relocate 2>&1 | tee displaced-admin-baseline.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: displaced-admin-baseline
          path: displaced-admin-baseline.txt
