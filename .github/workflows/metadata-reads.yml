name: Metadata reads

on:
  pull_request:
    paths:
      - internal/vcs/**
      - scripts/measure-metadata-reads.py
      - .github/workflows/metadata-reads.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-reads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Check metadata semantics and measure allocation costs
        run: |
          go test -race ./internal/vcs -run 'TestReadGitMetadata|TestRetiredHoldingsMetadata' -count=1
          go test ./internal/vcs -run '^$' -bench '^BenchmarkReadGitMetadata$' -benchmem -count=3 | tee "$RUNNER_TEMP/metadata-bench.txt"
      - name: Compile fixed and allocation-stat baseline probes
        run: |
          go test -c -o "$RUNNER_TEMP/fixed.test" ./internal/vcs
          cat >internal/vcs/git_metadata.go <<'GO'
          package vcs
          import "os"
          func readGitMetadata(path string) ([]byte, error) { return os.ReadFile(path) }
          GO
          go test -c -o "$RUNNER_TEMP/baseline.test" ./internal/vcs
      - name: Verify metadata and identity syscall counts
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
          python3 scripts/measure-metadata-reads.py "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metadata-read-evidence
          path: |
            ${{ runner.temp }}/metadata-bench.txt
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/fixed.json
            ${{ runner.temp }}/*.strace.*
          retention-days: 7
